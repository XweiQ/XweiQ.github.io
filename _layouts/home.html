<!doctype html>
<html lang="en">
<head>
  {% assign asset_version = site.time | date: "%s" %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/arvid/stylesheet.css' | relative_url }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ '/assets/css/arvid/shared-styles.css' | relative_url }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ '/assets/css/arvid/homepage.css' | relative_url }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ '/assets/css/arvid/typography.css' | relative_url }}?v={{ asset_version }}">
</head>
<body>
  <div id="site-nav"></div>
  <main id="main-content" class="homepage page-shell">{{ content }}</main>
  <div id="site-footer"></div>
  <script src="{{ '/assets/js/arvid/site-shell.js' | relative_url }}?v={{ asset_version }}"></script>
  <script src="{{ '/assets/js/arvid/utils.js' | relative_url }}?v={{ asset_version }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Dark mode temporarily disabled; uncomment to restore with the navigation toggle.
      // initializeDarkMode();
      initializeBackToTop();
    });
  </script>
  {% include analytics.html %}
</body>
</html>
